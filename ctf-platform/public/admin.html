<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CTF Admin Console</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        .card { border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
        button { margin: 5px; }
    </style>
</head>
<body>
    <h1>Admin Console</h1>
    
    <div class="card">
        <h3>Metrics</h3>
        <p>Teams: <span id="m-teams">0</span></p>
        <p>Active Sessions: <span id="m-sessions">0</span></p>
        <p>Total Submissions: <span id="m-subs">0</span></p>
        <button onclick="loadStats()">Refresh Stats</button>
    </div>

    <div class="card">
        <h3>Event Controls</h3>
        <button onclick="control('start')">Start Event</button>
        <button onclick="control('pause')">Pause Event</button>
        <button onclick="control('stop')">Stop Event</button>
        <hr>
        <button onclick="control('freeze')">Freeze Scoreboard</button>
        <button onclick="control('unfreeze')">Unfreeze Scoreboard</button>
    </div>

    <div class="card">
        <h3>Teams / Session Reset</h3>
        <div id="teamsList"></div>
    </div>

    <div class="card">
        <h3>Team Verification</h3>
        <input type="file" id="csvFileInput" accept=".csv" />
        <button onclick="verifyTeams()">Upload & Verify</button>
        <p id="verifyResult" style="margin-top: 10px; font-weight: bold;"></p>
    </div>

    <div class="card">
        <h3>Event Management</h3>
        <div style="margin-bottom: 10px;">
            <h4>Create Event</h4>
            <input type="text" id="eventName" placeholder="Event Name" />
            <input type="text" id="eventDesc" placeholder="Event Description" />
            <label><input type="checkbox" id="eventActive" checked /> Active</label>
            <button onclick="createEvent()">Create Event</button>
        </div>
        <hr>
        <div style="margin-top: 10px;">
            <h4>Delete Event (Destructive)</h4>
            <input type="number" id="deleteEventId" placeholder="Event ID" />
            <button onclick="deleteEvent()" style="background-color: #ff4444; color: white;">Wipe Event & Files</button>
        </div>
    </div>

    <script>
        const SECRET = 'admin-secret-key'; 

        async function fetchAPI(url, opts = {}) {
            opts.headers = { ...opts.headers, 'Authorization': `Bearer ${SECRET}` };
            return fetch(url, opts);
        }

        async function createEvent() {
            const name = document.getElementById('eventName').value;
            const description = document.getElementById('eventDesc').value;
            const isActive = document.getElementById('eventActive').checked;
            
            if (!name) return alert('Event Name is required');

            const res = await fetchAPI('/api/admin/events', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, description, isActive })
            });
            const data = await res.json();
            if (data.success) {
                alert('Event created successfully with ID: ' + data.event.id);
            } else {
                alert('Error creating event: ' + data.error);
            }
        }

        async function deleteEvent() {
            const eventId = document.getElementById('deleteEventId').value;
            if (!eventId) return alert('Event ID is required');
            
            if (!confirm(`Are you absolutely sure you want to delete Event ${eventId}? This will WIPE the database records and all local files for this event!`)) {
                return;
            }

            const res = await fetchAPI(`/api/admin/events/${eventId}`, {
                method: 'DELETE'
            });
            const data = await res.json();
            if (data.success) {
                alert('Event deleted and filesystem wiped successfully');
            } else {
                alert('Error deleting event: ' + data.error);
            }
        }

        async function loadStats() {
            const res = await fetchAPI('/api/admin/stats');
            if (!res.ok) return alert('Unauthorized or error');
            const data = await res.json();
            document.getElementById('m-teams').innerText = data.teams;
            document.getElementById('m-sessions').innerText = data.activeSessions;
            document.getElementById('m-subs').innerText = data.submissions;
            loadTeams();
        }

        async function loadTeams() {
            const res = await fetchAPI('/api/admin/teams');
            const teams = await res.json();
            const list = document.getElementById('teamsList');
            list.innerHTML = '';
            teams.forEach(t => {
                list.innerHTML += `
                    <div style="margin-bottom: 5px;">
                        <strong>${t.teamName}</strong> 
                        ${t.activeSessionId ? `<button onclick="resetSession(${t.id})">Reset Session</button>` : '(No active session)'}
                    </div>
                `;
            });
        }

        async function control(action) {
            await fetchAPI('/api/admin/event-control', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action })
            });
            alert('Action applied: ' + action);
        }

        async function resetSession(teamId) {
            await fetchAPI('/api/admin/reset-session', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ teamId })
            });
            alert('Session reset for team ' + teamId);
            loadStats();
        }

        async function verifyTeams() {
            const fileInput = document.getElementById('csvFileInput');
            if (!fileInput.files.length) return alert('Please select a CSV file first.');
            
            const formData = new FormData();
            formData.append('sheet', fileInput.files[0]);
            
            const resultElem = document.getElementById('verifyResult');
            resultElem.innerText = 'Verifying...';

            try {
                const res = await fetchAPI('/api/admin/verify-teams/active', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await res.json();
                if (data.success) {
                    resultElem.innerText = `Success! Verified: ${data.verifiedCount}, Not Found: ${data.notFoundCount}`;
                } else {
                    resultElem.innerText = `Error: ${data.error || 'Check console'}`;
                }
            } catch (err) {
                resultElem.innerText = `Upload failed: ${err.message}`;
            }
        }

        loadStats();
    </script>
</body>
</html>
